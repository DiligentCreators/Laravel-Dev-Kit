name: Code Quality Checks

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Set Up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install Node.js Dependencies
              run: npm ci

            - name: Set Up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  tools: composer
                  coverage: none

            - name: Install Composer Dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Check Prettier
              run: npx prettier --check .

            - name: Lint PHP (Duster)
              run: ./vendor/bin/duster lint

    tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Set Up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install Node.js Dependencies
              run: npm ci

            - name: Set Up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: mbstring, sqlite, pdo_sqlite, tokenizer, xml, ctype, json, bcmath
                  tools: composer
                  coverage: none

            - name: Install Composer Dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Prepare Application
              run: |
                  cp .env.example .env
                  php artisan key:generate --ansi

            - name: Build Frontend Assets
              run: npm run build

            - name: Run Tests
              run: php artisan test
